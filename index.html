<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Web Chat</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
    #chat-container { width: 100%; max-width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
    #messages { height: 300px; overflow-y: auto; padding: 15px; border-bottom: 1px solid #ddd; }
    .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; background: #e9ecef; }
    #input-box { display: flex; padding: 10px; }
    #input-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    #input-box button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; margin-left: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="messages"></div>
  <div id="input-box">
    <input type="text" id="messageInput" placeholder="Ketik pesan..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
  const socket = io("http://140.213.74.29:3000");

  const messagesDiv = document.getElementById('messages');

  socket.on('receive_message', (data) => {
    const msgElement = document.createElement('div');
    msgElement.className = 'msg';
    msgElement.innerText = data;
    messagesDiv.appendChild(msgElement);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  function sendMessage() {
    const input = document.getElementById('messageInput');
    if (input.value.trim() !== "") {
      socket.emit('send_message', input.value);
      input.value = "";
    }
  }
</script>

</body>
</html>
